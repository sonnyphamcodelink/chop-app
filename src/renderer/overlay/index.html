<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chop capture</title>
    <style>
      :root {
        --accent: #f5a000;
        /* main.ts installs the shared guide metrics and region reticle. */
        --guide: 1px;
        --arm-length: 51px;
        --arm-gap: 20px;
        --arm-weight: 4px;
        --dash: 20px;
        --period: 28px;
        --cursor: crosshair;
        --guide-shadow: drop-shadow(0 0 1.5px rgba(0, 0, 0, 0.9));
        /* Sparse dashes for the candidate-window frame. A gradient rather than
           a dashed border, so dash and gap lengths are ours to set. */
        --dash-h: repeating-linear-gradient(
          to right,
          var(--accent) 0 var(--dash),
          transparent var(--dash) var(--period)
        );
        --dash-v: repeating-linear-gradient(
          to bottom,
          var(--accent) 0 var(--dash),
          transparent var(--dash) var(--period)
        );
      }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        cursor: var(--cursor);
        user-select: none;
        background: transparent;
      }
      #frozen {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        -webkit-user-drag: none;
      }
      #veil {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
      }
      /* The selected area is punched out of the veil by a huge box-shadow. */
      #cutout {
        position: fixed;
        display: none;
        box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.35);
        outline: 2px solid var(--accent);
        pointer-events: none;
      }
      /* A window under the cursor is only a candidate, so its frame is a
         sparsely dashed hairline: the guide colour and weight, never the solid
         outline a committed selection gets. */
      #cutout.window {
        outline: none;
      }
      #cutout.window::after {
        content: '';
        position: absolute;
        inset: calc(var(--guide) * -1);
        background:
          var(--dash-h) left top / 100% var(--guide) repeat-x,
          var(--dash-h) left bottom / 100% var(--guide) repeat-x,
          var(--dash-v) left top / var(--guide) 100% repeat-y,
          var(--dash-v) right top / var(--guide) 100% repeat-y;
        filter: var(--guide-shadow);
      }
      /* Solid guides that track the pointer, Snagit style. */
      .crosshair {
        position: fixed;
        display: none;
        pointer-events: none;
        filter: var(--guide-shadow);
      }
      #cross-x {
        left: 0;
        width: 100vw;
        height: var(--guide);
        background: var(--accent);
      }
      #cross-y {
        top: 0;
        width: var(--guide);
        height: 100vh;
        background: var(--accent);
      }
      /* Four heavier arms sit just off the pointer — the emphasis a hairline
         guide cannot carry. They live here rather than in the cursor image
         because Chromium drops cursors wider than 128px. */
      #reticle {
        width: 0;
        height: 0;
      }
      #reticle span {
        position: absolute;
        background: var(--accent);
        border-radius: calc(var(--arm-weight) / 2);
      }
      #reticle .vertical {
        width: var(--arm-weight);
        height: var(--arm-length);
        left: calc(var(--arm-weight) / -2);
      }
      #reticle .horizontal {
        width: var(--arm-length);
        height: var(--arm-weight);
        top: calc(var(--arm-weight) / -2);
      }
      #reticle .up {
        bottom: var(--arm-gap);
      }
      #reticle .down {
        top: var(--arm-gap);
      }
      #reticle .left {
        right: var(--arm-gap);
      }
      #reticle .right {
        left: var(--arm-gap);
      }
      #label {
        position: fixed;
        display: none;
        padding: 3px 7px;
        font: 12px -apple-system, system-ui, sans-serif;
        color: #fff;
        background: rgba(0, 0, 0, 0.78);
        border-radius: 4px;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        padding: 8px 14px;
        font: 13px -apple-system, system-ui, sans-serif;
        color: #fff;
        background: rgba(0, 0, 0, 0.7);
        border-radius: 8px;
        pointer-events: none;
      }
      #input-layer {
        position: fixed;
        inset: 0;
        cursor: var(--cursor);
      }
    </style>
  </head>
  <body>
    <img id="frozen" alt="" draggable="false" />
    <div id="veil"></div>
    <div id="cutout"></div>
    <div id="label"></div>
    <div id="cross-x" class="crosshair"></div>
    <div id="cross-y" class="crosshair"></div>
    <div id="reticle" class="crosshair">
      <span class="vertical up"></span>
      <span class="vertical down"></span>
      <span class="horizontal left"></span>
      <span class="horizontal right"></span>
    </div>
    <div id="hint">Click a window · Drag a region · Esc to cancel</div>
    <div id="input-layer"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
