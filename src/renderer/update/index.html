<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Updating Chop</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: oklch(0.55 0.19 258);
        --muted: color-mix(in oklab, currentColor 58%, transparent);
        --line: color-mix(in oklab, currentColor 18%, transparent);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; font: 13px -apple-system, system-ui, sans-serif; }
      body { padding: 24px; user-select: none; }
      h1 { margin: 0 0 8px; font-size: 16px; }
      #message { margin: 0 0 18px; color: var(--muted); line-height: 1.4; }
      progress {
        display: block; width: 100%; height: 8px; margin: 0 0 9px;
        border: 0; border-radius: 999px; overflow: hidden; accent-color: var(--accent);
      }
      progress::-webkit-progress-bar { background: var(--line); border-radius: 999px; }
      progress::-webkit-progress-value { background: var(--accent); border-radius: 999px; }
      .footer { display: flex; align-items: center; gap: 12px; }
      #detail { flex: 1; color: var(--muted); font-variant-numeric: tabular-nums; }
      button {
        padding: 7px 14px; border: 1px solid var(--line); border-radius: 7px;
        background: transparent; color: inherit; font: inherit; cursor: pointer;
      }
      button:hover { background: color-mix(in oklab, currentColor 7%, transparent); }
      button:disabled { opacity: .45; cursor: default; }
      body.failed progress { display: none; }
      body.failed #message { color: oklch(0.58 0.19 25); }
    </style>
  </head>
  <body>
    <h1 id="title">Downloading update…</h1>
    <p id="message">Chop will reopen automatically when the update is installed.</p>
    <progress id="progress" max="100" value="0"></progress>
    <div class="footer">
      <span id="detail">Starting…</span>
      <button id="cancel" type="button">Cancel</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
