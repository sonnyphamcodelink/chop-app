appId: com.sonnypham.chop
productName: Chop
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/windowlist
    to: windowlist
  - from: resources/tray-icon.png
    to: tray-icon.png
  # nativeImage picks the @2x file up from beside the 1x one on retina screens.
  - from: resources/tray-icon@2x.png
    to: tray-icon@2x.png
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  # Screen Recording permission is bound to the code signature, so an ad-hoc
  # signature keeps the grant stable across rebuilds of the same build config.
  identity: null
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSScreenCaptureUsageDescription: Chop needs screen access to capture screenshots.
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
