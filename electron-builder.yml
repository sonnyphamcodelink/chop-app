appId: com.sonnypham.chop
productName: Chop
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# Platform sections replace this list rather than merging with it, so the mac
# section below repeats these entries alongside its own helper binary.
extraResources:
  # Used by the native About panel on Windows and Linux.
  - from: build/icon.png
    to: app-icon.png
  - from: resources/tray-icon.png
    to: tray-icon.png
  # nativeImage picks the @2x file up from beside the 1x one on retina screens.
  - from: resources/tray-icon@2x.png
    to: tray-icon@2x.png
mac:
  icon: build/icon.png
  # The window helper is compiled by scripts/build-swift-helper.mjs, which only
  # runs on macOS, so only the mac artifacts can ship it.
  extraResources:
    - from: build/icon.png
      to: app-icon.png
    - from: resources/windowlist
      to: windowlist
    - from: resources/tray-icon.png
      to: tray-icon.png
    - from: resources/tray-icon@2x.png
      to: tray-icon@2x.png
  category: public.app-category.productivity
  # Deliberately version-less. The landing page links straight at
  # releases/latest/download/<name>, which only resolves for a name that does
  # not change between releases — that is what makes Download a download
  # rather than a trip to GitHub. The app reports its own version anyway.
  artifactName: ${productName}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
  # Screen Recording permission is bound to the code signature, so an ad-hoc
  # signature keeps the grant stable across rebuilds of the same build config.
  # "-" is codesign's ad-hoc identity. null skips signing entirely, which on
  # Apple Silicon looks like a damaged app rather than an unverified one.
  identity: "-"
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSScreenCaptureUsageDescription: Chop needs screen access to capture screenshots.
win:
  icon: build/icon.png
  # Version-less for the same reason as the mac artifacts above.
  artifactName: ${productName}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
